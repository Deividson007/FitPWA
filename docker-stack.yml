services:
  fit:
    image: ghcr.io/Deividson007/fitflow-pwa:latest

    networks:
      - homelab

    deploy:
      replicas: 1

      restart_policy:
        condition: any

      update_config:
        order: start-first

      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=homelab"
        - "traefik.http.routers.fit.rule=Host(`fit.homelab`)"
        - "traefik.http.routers.fit.entrypoints=websecure"
        - "traefik.http.routers.fit.tls=true"
        - "traefik.http.services.fit.loadbalancer.server.port=80"

networks:
  homelab:
    external: true